services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dashboard_demo
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./duckdb/database/demo_database_patch.sql:/docker-entrypoint-initdb.d/001-demo.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP --host=127.0.0.1 --user=root --database=dashboard_demo --silent --skip-column-names --execute='SELECT 1 FROM top_selling_skus LIMIT 1'
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  demo_mysql_data:
